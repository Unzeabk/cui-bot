name: Cui Bono — рубрики

on:
  schedule:
    # По Москве: Разбор каждый день 11:22 (сразу после сброса квот Gemini; запасной 15:22, пропускается, если утренний вышел) ·
    # пн 10:52 Показатели · вт и чт 13:52 Позиция · сб 12:52 Неделя. Cron в UTC.
    - cron: "52 7 * * 1"
    - cron: "52 10 * * 2,4"
    - cron: "22 8 * * *"
    - cron: "22 12 * * *"
    - cron: "52 9 * * 6"
  workflow_dispatch:
    inputs:
      format:
        description: "Рубрика"
        type: choice
        options: [indicators, position, analysis, week]
        default: week
      dry_run:
        description: "Пробный запуск: собрать, но не отправлять в канал"
        type: boolean
        default: true
      test_data:
        description: "Тестовый текст вместо настоящего (любая рубрика): посмотреть вёрстку, не тратя квоту"
        type: boolean
        default: false
      chat_id:
        description: "Куда отправить вместо канала: ваш Telegram ID (от @userinfobot; сначала /start боту). Пусто — в канал"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: cui-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Рубрика
        env:
          CUI_CONFIG: ${{ secrets.CUI_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          WRITER_MODELS: ${{ vars.WRITER_MODELS }}
          LIGHT_MODELS: ${{ vars.LIGHT_MODELS }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          TG_CHANNELS: ${{ vars.TG_CHANNELS }}
          SITE_LABEL: ${{ vars.SITE_LABEL }}
          FORMAT: ${{ inputs.format || 'auto' }}
          CRON: ${{ github.event.schedule }}
          SITE_URL: ${{ vars.SITE_URL || 'https://cuibono.press' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4ffcbbed465bb60c05bc6203792fac1a
          METRIKA_ID: ${{ vars.METRIKA_ID || '113988036' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TEST_DATA: ${{ inputs.test_data && '1' || '' }}
          TEST_CHAT: ${{ inputs.chat_id }}
        run: python -m bot.formats

      - name: Сохранить пост как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubric-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore

      - name: Записать в журнал ленты
        if: success() && !inputs.dry_run && !inputs.test_data && inputs.chat_id == ''
        run: |
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Рубрика $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Сайт
        # Сайт собирается из приватного репозитория и выкладывается на Cloudflare Pages: публичного репозитория нет.
        # Нужны secrets.CLOUDFLARE_API_TOKEN, secrets.CLOUDFLARE_ACCOUNT_ID и vars.SITE_URL. Пока их нет, шаг пропускается.
        if: success() && !inputs.dry_run
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://cuibono.press' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4ffcbbed465bb60c05bc6203792fac1a
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
          METRIKA_ID: ${{ vars.METRIKA_ID || '113988036' }}
          CUI_CONFIG: ${{ secrets.CUI_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIGHT_MODELS: ${{ vars.LIGHT_MODELS }}
        run: |
          git pull --rebase --autostash -X theirs origin main || true
          python -m bot.site site
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add site state/site-posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Сайт $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 5; done
          fi
          npx --yes wrangler@3 pages project create cuibono --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name=cuibono --branch=main --commit-dirty=true
          sleep 45  # новые адреса уже открываются — сообщаем поисковикам
          python -m bot.site --ping site
