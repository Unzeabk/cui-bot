name: Cui Bono — рубрики

on:
  schedule:
    # По Москве: пн 10:52 Показатели · вт 13:52 Позиция · ср 11:22 Разбор · чт 13:52 Позиция ·
    # пт 11:22 Разбор · сб 12:52 Неделя · вс 11:22 Разбор. Разбор — сразу после сброса квот Gemini, запасной запуск в 15:22
    # (пропускается, если утренний вышел). Cron в UTC.
    - cron: "52 7 * * 1"
    - cron: "52 10 * * 2,4"
    - cron: "22 8 * * 0,3,5"
    - cron: "22 12 * * 0,3,5"
    - cron: "52 9 * * 6"
  workflow_dispatch:
    inputs:
      format:
        description: "Рубрика"
        type: choice
        options: [indicators, position, analysis, week]
        default: week
      dry_run:
        description: "Пробный запуск: собрать, но не отправлять в канал"
        type: boolean
        default: true
      test_data:
        description: "Тестовый текст вместо настоящего (любая рубрика): посмотреть вёрстку, не тратя квоту"
        type: boolean
        default: false
      chat_id:
        description: "Куда отправить вместо канала: ваш Telegram ID (от @userinfobot; сначала /start боту). Пусто — в канал"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: cui-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Рубрика
        env:
          CUI_CONFIG: ${{ secrets.CUI_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          WRITER_MODELS: ${{ vars.WRITER_MODELS }}
          LIGHT_MODELS: ${{ vars.LIGHT_MODELS }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          TG_CHANNELS: ${{ vars.TG_CHANNELS }}
          SITE_LABEL: ${{ vars.SITE_LABEL }}
          FORMAT: ${{ inputs.format || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TEST_DATA: ${{ inputs.test_data && '1' || '' }}
          TEST_CHAT: ${{ inputs.chat_id }}
        run: python -m bot.formats

      - name: Сохранить пост как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubric-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore

      - name: Записать в журнал ленты
        if: success() && !inputs.dry_run && !inputs.test_data && inputs.chat_id == ''
        run: |
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Рубрика $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Сайт
        # Публичный репозиторий сайта (vars.SITE_REPO, например Unzeabk/cuibono) и токен с правом записи в него (secrets.SITE_TOKEN).
        # Пока переменная не задана, шаг пропускается.
        if: success() && !inputs.dry_run && vars.SITE_REPO != ''
        continue-on-error: true
        env:
          SITE_REPO: ${{ vars.SITE_REPO }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
        run: |
          git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}.git" site
          python -m bot.site site
          cd site
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Публикация $(date -u +'%Y-%m-%d %H:%M')"
          ok=""
          for i in 1 2 3; do git pull --rebase origin HEAD && git push && ok=1 && break; sleep 5; done
          [ -n "$ok" ] || exit 1
          cd ..
          sleep 75  # GitHub Pages выкладывает сайт около минуты
          python -m bot.site --ping site
