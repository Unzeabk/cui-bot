name: Cui Bono — закреп

# Один раз публикует и закрепляет пост о письме по субботам (state/pinned.json не даёт повторить).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/pin.py"]

permissions:
  contents: write

concurrency:
  group: cui-post
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - env:
          CUI_CONFIG: ${{ secrets.CUI_CONFIG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          python -m bot.pin
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add state/pinned.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Закреп: письмо по субботам"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
