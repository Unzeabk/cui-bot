name: Cui Bono — заметки

on:
  schedule:
    # 10 заметок в сутки по Москве: днём 08:37, 10:37, 12:37, 14:37, 17:07, 19:37, 22:07 (между ними — рубрики),
    # ночью 23:37, 02:37, 05:37 — для релокантов в других часовых поясах.
    # cron в UTC; минуты не круглые — GitHub меньше задерживает
    - cron: "37 5 * * *"
    - cron: "37 7 * * *"
    - cron: "37 9 * * *"
    - cron: "37 11 * * *"
    - cron: "7 14 * * *"
    - cron: "37 16 * * *"
    - cron: "7 19 * * *"
    - cron: "37 20 * * *"
    - cron: "37 23 * * *"
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробный запуск: собрать пост, но не отправлять в канал"
        type: boolean
        default: true
      count:
        description: "Сколько заметок выпустить подряд (1–8), для стартового наполнения ленты"
        type: string
        default: "1"

permissions:
  contents: write

concurrency:
  group: cui-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Заметка
        env:
          CUI_CONFIG: ${{ secrets.CUI_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          WRITER_MODELS: ${{ vars.WRITER_MODELS }}
          LIGHT_MODELS: ${{ vars.LIGHT_MODELS }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          TG_CHANNELS: ${{ vars.TG_CHANNELS }}
          SITE_LABEL: ${{ vars.SITE_LABEL }}
          CUSTOM_EMOJI_JSON: ${{ vars.CUSTOM_EMOJI_JSON }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          POST_COUNT: ${{ inputs.count || '1' }}
        run: python -m bot.main

      - name: Сохранить пост как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore

      - name: Записать в журнал ленты
        if: success() && !inputs.dry_run
        run: |
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Заметка $(date -u +'%Y-%m-%d %H:%M')"
          # пока бот работал, в репозитории могли появиться новые коммиты — подтягиваем их и повторяем
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Сайт
        # Сайт собирается из приватного репозитория и выкладывается на Cloudflare Pages: публичного репозитория нет.
        # Нужны secrets.CLOUDFLARE_API_TOKEN, secrets.CLOUDFLARE_ACCOUNT_ID и vars.SITE_URL. Пока их нет, шаг пропускается.
        if: success() && !inputs.dry_run
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://cuibono.press' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4ffcbbed465bb60c05bc6203792fac1a
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
        run: |
          git pull --rebase -X theirs origin main || true
          python -m bot.site site
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add site state/site-posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Сайт $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
          npx --yes wrangler@3 pages project create cuibono --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name=cuibono --branch=main --commit-dirty=true
          sleep 45  # новые адреса уже открываются — сообщаем поисковикам
          python -m bot.site --ping site
