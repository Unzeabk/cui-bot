name: Cui Bono — заметки

on:
  # Запускает только будильник Cloudflare (worker/index.js, таблица SLOTS). Расписание GitHub убрано 2 ноября:
  # оно теряло запуски, а опоздавшие тратили квоту Gemini.
  workflow_dispatch:
    inputs:
      slot:
        description: "Слот расписания (cron). Заполняет будильник Cloudflare; руками — пусто"
        type: string
        default: ""
      dry_run:
        description: "Пробный запуск: собрать пост, но не отправлять в канал"
        type: boolean
        default: true
      count:
        description: "Сколько заметок выпустить подряд (1–8), для стартового наполнения ленты"
        type: string
        default: "1"

permissions:
  contents: write

concurrency:
  group: cui-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # свежий main на момент старта, а не коммит момента постановки в очередь: иначе не видно, что слот уже вышел

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Заметка
        env:
          CUI_CONFIG: ${{ secrets.CUI_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          WRITER_MODELS: ${{ vars.WRITER_MODELS }}
          LIGHT_MODELS: ${{ vars.LIGHT_MODELS }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          TG_CHANNELS: ${{ vars.TG_CHANNELS }}
          SITE_LABEL: ${{ vars.SITE_LABEL }}
          CUSTOM_EMOJI_JSON: ${{ vars.CUSTOM_EMOJI_JSON }}
          SLOT: ${{ github.event.schedule || inputs.slot }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          POST_COUNT: ${{ inputs.count || '1' }}
        run: python -m bot.main

      - name: Сохранить пост как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore

      - name: Записать в журнал ленты
        if: success() && !inputs.dry_run
        run: |
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Заметка $(date -u +'%Y-%m-%d %H:%M')"
          # пока бот работал, в репозитории могли появиться новые коммиты — подтягиваем их и повторяем
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Сайт
        # Сайт собирается из приватного репозитория и выкладывается на Cloudflare Pages: публичного репозитория нет.
        # Нужны secrets.CLOUDFLARE_API_TOKEN, secrets.CLOUDFLARE_ACCOUNT_ID и vars.SITE_URL. Пока их нет, шаг пропускается.
        if: success() && !inputs.dry_run
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://cuibono.press' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4ffcbbed465bb60c05bc6203792fac1a
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          BING_VERIFICATION: ${{ vars.BING_VERIFICATION }}
          GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
          METRIKA_ID: ${{ vars.METRIKA_ID || '113988036' }}
          CUI_CONFIG: ${{ secrets.CUI_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          LIGHT_MODELS: ${{ vars.LIGHT_MODELS }}
        run: |
          git pull --rebase --autostash -X theirs origin main || true
          new_brevo=$([ -f state/brevo.json ] && echo 0 || echo 1)
          BREVO_API_KEY='${{ secrets.BREVO_API_KEY }}' python -m bot.brevo setup || true
          python -m bot.site site
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add site state/site-posts.json state/cbr-releases.json state/docs.json $(ls state/brevo.json state/stamps.json 2>/dev/null)
          if ! git diff --cached --quiet; then
            git commit -m "Сайт $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 5; done
          fi
          npx --yes wrangler@3 pages project create cuibono --production-branch=main >/dev/null 2>&1 || true  # проект уже есть — это нормально
          if [ "$new_brevo" = 1 ] && [ -f state/brevo.json ]; then
            echo '${{ secrets.BREVO_API_KEY }}' | npx --yes wrangler@3 pages secret put BREVO_API_KEY --project-name=cuibono || true
            python -c "import json;print(json.load(open('state/brevo.json')).get('list_id',''))" | npx --yes wrangler@3 pages secret put BREVO_LIST_ID --project-name=cuibono || true
          fi
          npx --yes wrangler@3 pages deploy site --project-name=cuibono --branch=main --commit-dirty=true
          sleep 45  # новые адреса уже открываются — сообщаем поисковикам
          python -m bot.site --ping site
