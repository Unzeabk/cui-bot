name: Cui Bono — рассылка

# Субботнее письмо через Buttondown. Нужны secrets.BUTTONDOWN_API_KEY и vars.BUTTONDOWN_USER.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 6"  # сб 14:17 МСК, после «Недели»

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://cuibono.press' }}
        run: python -m bot.extras newsletter
