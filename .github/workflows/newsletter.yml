name: Cui Bono — рассылка

# Субботнее письмо через Brevo. Нужны secrets.BREVO_API_KEY, vars.BREVO_LIST_ID, vars.BREVO_SENDER.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 6"  # сб 14:17 МСК, после «Недели»

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER: ${{ vars.BREVO_SENDER }}
          SITE_URL: ${{ vars.SITE_URL || 'https://cuibono.press' }}
        run: python -m bot.extras newsletter
