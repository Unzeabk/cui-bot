name: Cui Bono — рассылка

# Субботнее письмо через Brevo. Нужен только secrets.BREVO_API_KEY; список и отправитель — в state/brevo.json.
on:
  workflow_dispatch:
  push:  # проба: адрес в state/newsletter-test.txt — письмо уходит только ему, файл потом удаляется
    branches: [main]
    paths: ["state/newsletter-test.txt"]
  schedule:
    # основной запуск — будильник Cloudflare (worker/); это запасной, повторное письмо за ту же неделю не уходит
    - cron: "17 11 * * 6"  # сб 14:17 МСК, после «Недели»

permissions:
  contents: write

concurrency:
  group: cui-newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://cuibono.press' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            [ -f state/newsletter-test.txt ] || exit 0
            TEST_EMAIL="$(head -1 state/newsletter-test.txt)" python -m bot.extras newsletter
            git config user.name "cui-bot"; git config user.email "cui-bot@users.noreply.github.com"
            git rm -q state/newsletter-test.txt && git commit -m "Проба письма отправлена" && git push || true
          else
            python -m bot.extras newsletter
            git config user.name "cui-bot"; git config user.email "cui-bot@users.noreply.github.com"
            git add state/newsletter-sent.txt 2>/dev/null || true
            git diff --cached --quiet || { git commit -m "Рассылка отправлена"; for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 5; done; }
          fi
