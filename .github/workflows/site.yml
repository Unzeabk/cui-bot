name: Cui Bono — сайт

# Пересобрать и выложить сайт без нового поста. Запускается вручную или при изменении кода сайта.
on:
  workflow_dispatch:
    inputs:
      clear:
        description: "Удалить с сайта все тексты и собрать заново (данные и страницы рубрик останутся)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["bot/site.py", "bot/brevo.py", "functions/**", "bot/data_pages.py", "bot/extras.py", "bot/visuals.py", ".github/workflows/site.yml", "state/site-remove.txt"]

permissions:
  contents: write

concurrency:
  group: cui-post
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Сайт
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://cuibono.press' }}
          SITE_CLEAR: ${{ inputs.clear && '1' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4ffcbbed465bb60c05bc6203792fac1a
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          BING_VERIFICATION: ${{ vars.BING_VERIFICATION }}
          GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
          METRIKA_ID: ${{ vars.METRIKA_ID || '113988036' }}
          CUI_CONFIG: ${{ secrets.CUI_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          LIGHT_MODELS: ${{ vars.LIGHT_MODELS }}
        run: |
          BREVO_API_KEY='${{ secrets.BREVO_API_KEY }}' python -m bot.brevo setup
          python -m bot.site site
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add site state/site-posts.json state/cbr-releases.json state/docs.json $(ls state/brevo.json state/stamps.json state/series.json state/visuals-log.json 2>/dev/null)
          if ! git diff --cached --quiet; then
            git commit -m "Сайт $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
          npx --yes wrangler@3 pages project create cuibono --production-branch=main >/dev/null 2>&1 || true  # проект уже есть — это нормально
          if [ -n "${{ secrets.BREVO_API_KEY }}" ] && [ -f state/brevo.json ] && ! grep -q '"checked": true' state/brevo.json; then  # ключ в Pages — один раз
            echo '${{ secrets.BREVO_API_KEY }}' | npx --yes wrangler@3 pages secret put BREVO_API_KEY --project-name=cuibono || true
            python -c "import json;print(json.load(open('state/brevo.json')).get('list_id',''))" | npx --yes wrangler@3 pages secret put BREVO_LIST_ID --project-name=cuibono || true
          fi
          for i in 1 2 3 4; do npx --yes wrangler@3 pages deploy site --project-name=cuibono --branch=main --commit-dirty=true && break; echo "выкладка не прошла (сбой Cloudflare), повтор через 30 с"; sleep 30; done
          if [ -f state/brevo.json ] && ! grep -q '"checked": true' state/brevo.json; then
            sleep 40
            BREVO_API_KEY='${{ secrets.BREVO_API_KEY }}' python -m bot.brevo selftest || true
            git add state/brevo.json && git commit -m "Brevo: проверка" && git pull --rebase -X theirs origin main && git push || true
          fi
