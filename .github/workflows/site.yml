name: Cui Bono — сайт

# Пересобрать и выложить сайт без нового поста. Запускается вручную или при изменении кода сайта.
on:
  workflow_dispatch:
    inputs:
      clear:
        description: "Удалить с сайта все тексты и собрать заново (данные и страницы рубрик останутся)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["bot/site.py", "bot/data_pages.py", "bot/extras.py", ".github/workflows/site.yml", "state/site-remove.txt"]

permissions:
  contents: write

concurrency:
  group: cui-post
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: pip install -r requirements.txt
      - name: Сайт
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://cuibono.press' }}
          SITE_CLEAR: ${{ inputs.clear && '1' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4ffcbbed465bb60c05bc6203792fac1a
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          BUTTONDOWN_USER: ${{ vars.BUTTONDOWN_USER }}
          BING_VERIFICATION: ${{ vars.BING_VERIFICATION }}
          GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
          METRIKA_ID: ${{ vars.METRIKA_ID || '113988036' }}
          CUI_CONFIG: ${{ secrets.CUI_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIGHT_MODELS: ${{ vars.LIGHT_MODELS }}
        run: |
          python -m bot.site site
          git config user.name "cui-bot"
          git config user.email "cui-bot@users.noreply.github.com"
          git add site state/site-posts.json state/dividends.json state/cbr-releases.json state/docs.json
          if ! git diff --cached --quiet; then
            git commit -m "Сайт $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
          npx --yes wrangler@3 pages project create cuibono --production-branch=main || true
          npx --yes wrangler@3 pages deploy site --project-name=cuibono --branch=main --commit-dirty=true
